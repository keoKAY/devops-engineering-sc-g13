services:
  nginx-svc: 
    image: nginx:alpine
    container_name: nginx-cont 
    configs: 
      - source: nginx-config
        target: /etc/nginx/conf.d/default.conf
    ports: 
    - 3000:80
configs:
  nginx-config: 
    file: ./configs/default.conf

# whenever you update the configs
# and want to apply it 
#docker compose exec nginx-svc nginx -t
#docker compose exec nginx-svc nginx -s reload  