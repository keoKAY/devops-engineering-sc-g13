volumes:
  postgres-vol: 
services:
  postgres-svc: 
    image: postgres 
    ports: 
      - 5432:5432
    volumes:
      - postgres-vol:/var/lib/postgresql
  nginx-svc:
    image: nginx:latest
    ports:
      - "9090:80"
      - "9090:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro


