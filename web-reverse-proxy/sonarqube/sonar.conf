#/etc/nginx/conf.d/sonar.conf  
# when user send request to server with domain 
# sc-sonar.domain.site , nginx will pass the request to sonarqube container 

server{
    listen 80; 
    server_name sc-sonar.akasdev.com; 
    location / {
        proxy_pass http://localhost:9000; 
        
        # Forward crucial original client headers to the backend
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;

        # Upgrade headers for WebSocket support (Optional but recommended)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

    }
}
